# DECIPHER Analysis API Docker Compose
#
# Usage:
#   Start:  docker compose -f docker-compose.decipher.yml up -d
#   Stop:   docker compose -f docker-compose.decipher.yml down
#   Logs:   docker compose -f docker-compose.decipher.yml logs -f
#   Build:  docker compose -f docker-compose.decipher.yml build

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile.decipher
    image: decipher/api:${API_VERSION:-latest}
    # Do not pull from registry, use local build
    pull_policy: never
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - satrap-dl-net
    volumes:
      # Mount host's config folder to container, read-only
      - ../config:/satrap-dl/config:ro
    # Disable container processes from gaining new privileges
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  satrap-dl-net:
    driver: bridge
