# DECIPHER Analysis API Docker Compose
#
# Usage:
#   Start:  docker compose -f docker-compose.decipher.yml up -d
#   Stop:   docker compose -f docker-compose.decipher.yml down
#   Logs:   docker compose -f docker-compose.decipher.yml logs -f
#   Build:  docker compose -f docker-compose.decipher.yml build

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile.decipher
    image: decipher/api:${VERSION:-latest}
    pull_policy: never         # Do not pull from registry, use local build
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - satrap-dl-net
    volumes:
      - ../config:/satrap-dl/config  # Mount host's config folder to container
    restart: unless-stopped
    # Potentially useful for dependency checks, currently not needed
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:${API_PORT:-8000}/health"]
    #   interval: 30s
    #   timeout: 10s
    #   start_period: 10s
    #   retries: 3

networks:
  satrap-dl-net:
    driver: bridge
