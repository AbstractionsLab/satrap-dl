# SATRAP deployment stack
#
# Services:
#   typedb - long-running TypeDB knowledge-base server (persistent)
#   satrap - build-only service defining the satrap CLI image
#
# The recommended entrypoints are the wrapper scripts, run from this directory:
#   Start TypeDB + build image:  ./satrap_up.sh
#   Stop the stack:               ./satrap_down.sh [--purge]

services:
  typedb:
    image: vaticle/typedb:2.29.0
    # The TypeDB server distribution is x86_64 only; force amd64 for compatibility
    platform: linux/amd64
    networks:
      - satrap-net
    # Published the port for TypeDB Studio, at localhost:1729.
    ports:
      - "${TYPEDB_HOST_PORT:-1729}:1729"
    volumes:
      - typedb-data:/opt/typedb-all-linux-x86_64/server/data
    healthcheck:
      # TypeDB listens on 1729; a successful TCP connect means it is ready.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/1729'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Build-only: `docker compose build satrap` produces the satrap:<version> image.
  # SATRAP_VERSION is mandatory as a default would silently mistag the image
  satrap:
    build:
      context: ..
      dockerfile: Dockerfile.satrap
      tags:
        - satrap:${SATRAP_VERSION:?SATRAP_VERSION must be set by satrap_up.sh}
    image: satrap:${SATRAP_VERSION:?SATRAP_VERSION must be set by satrap_up.sh}

networks:
  # the TypeDB server and the satrap CLI are attached to the same bridge
  satrap-net:
    name: satrap-net
    driver: bridge

volumes:
  typedb-data:
